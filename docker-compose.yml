services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connector
      POSTGRES_USER: connector
      POSTGRES_PASSWORD: connector
    ports: ["5432:5432"]
    volumes: ["connector_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector -d connector"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://connector:connector@db:5432/connector
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  connector_postgres:
